<!DOCTYPE html>
<html>
<head>
    <title>Level 4 JavaScript Tasks</title>
</head>
<body>

    <h1>Level 4: For Loop</h1>

    <script>

        // TASK 1: COUNT TO TEN

        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }


        // TASK 2: EVEN NUMBERS

        for (let i = 2; i <= 20; i++) {
            if (i % 2 === 0) {
                console.log(i);
            }
        }


        // TASK 3: SUM OF NUMBERS

        let totalSum = 0;

        for (let i = 1; i <= 100; i++) {
            totalSum = totalSum + i;
        }

        console.log("The sum of numbers 1 to 100 is " + totalSum);


        // TASK 4: MULTIPLICATION TABLE

        let number = 5;

        for (let i = 1; i <= 10; i++) {
            console.log(number + " x " + i + " = " + (number * i));
        }


        // TASK 5: REVERSE COUNTDOWN

        for (let i = 10; i >= 1; i--) {
            console.log(i);
        }

        console.log("Blast off!");

    </script>

</body>
</html>
