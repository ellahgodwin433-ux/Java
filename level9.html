<!DOCTYPE html>
<html>
<head>
    <title>Level 9 - More Practice</title>
</head>
<body>

    <script>

        // Task 1: Factorial

        function factorial(n) {
            let result = 1;

            for (let i = 1; i <= n; i++) {
                result = result * i;
            }

            return result;
        }

        console.log("Factorial:", factorial(5));


        // Task 2: Count Vowels

        function countVowels(str) {
            let count = 0;

            for (let i = 0; i < str.length; i++) {
                let letter = str[i].toLowerCase();

                if (
                    letter === "a" ||
                    letter === "e" ||
                    letter === "i" ||
                    letter === "o" ||
                    letter === "u"
                ) {
                    count++;
                }
            }

            return count;
        }

        console.log("Vowels:", countVowels("JavaScript"));


        // Task 3: Reverse a String

        function reverseString(str) {
            let reversed = "";

            for (let i = str.length - 1; i >= 0; i--) {
                reversed = reversed + str[i];
            }

            return reversed;
        }

        console.log("Reversed:", reverseString("Hello"));


        // Task 4: FizzBuzz

        for (let i = 1; i <= 50; i++) {

            if (i % 3 === 0 && i % 5 === 0) {
                console.log("FizzBuzz");
            } 
            else if (i % 3 === 0) {
                console.log("Fizz");
            } 
            else if (i % 5 === 0) {
                console.log("Buzz");
            } 
            else {
                console.log(i);
            }

        }


        // Task 5: Find Maximum in Array

        function findMaxNumber(numbers) {
            let max = numbers[0];

            for (let i = 1; i < numbers.length; i++) {
                if (numbers[i] > max) {
                    max = numbers[i];
                }
            }

            return max;
        }

        let numbers = [12, 45, 7, 89, 23, 56];

        console.log("Maximum number:", findMaxNumber(numbers));

    </script>

</body>
</html>
