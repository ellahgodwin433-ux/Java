<!DOCTYPE html>
<html>
<head>
    <title>Level 7 - Functions</title>
</head>
<body>

    <script>
        // Task 1: Greeting Function
        function greet(name) {
            return "Hello, " + name + "!";
        }

        console.log(greet("David"));


        // Task 2: Add Two Numbers
        function addNumbers(a, b) {
            return a + b;
        }

        console.log(addNumbers(10, 20));


        // Task 3: Even or Odd
        function isEven(number) {
            return number % 2 === 0;
        }

        console.log(isEven(8));


        // Task 4: Max of Three
        function findMax(a, b, c) {
            return Math.max(a, b, c);
        }

        console.log(findMax(15, 30, 25));


        // Task 5: Convert to Uppercase
        function toUpperCase(str) {
            return str.toUpperCase();
        }

        console.log(toUpperCase("javascript"));

    </script>

</body>
</html>
