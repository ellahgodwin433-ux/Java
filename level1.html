<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Tasks</title>
</head>
<body>

    <h1>Level 1: Variables and Basic Operators</h1>

    <script>

        // TASK 1: PERSONAL PROFILE

        let firstName = "David";
        let lastName = "Brooks";
        let age = 24;

        let fullName = firstName + " " + lastName;
        let birthYear = 2026 - age;

        console.log("My name is " + fullName + 
        ", I am " + age + " years old, and I was born in " + birthYear);


        // TASK 2: SIMPLE CALCULATOR

        let num1 = 10;
        let num2 = 5;

        let sum = num1 + num2;
        let difference = num1 - num2;
        let product = num1 * num2;
        let quotient = num1 / num2;

        console.log("The sum of " + num1 + " and " + num2 + " is " + sum);
        console.log("The difference is " + difference);
        console.log("The product is " + product);
        console.log("The quotient is " + quotient);


        // TASK 3: TEMPERATURE CONVERTER

        let celsius = 25;

        let fahrenheit = (celsius * 9/5) + 32;

        console.log(celsius + "°C is equal to " + fahrenheit + "°F");


        // TASK 4: AREA OF A RECTANGLE

        let length = 10;
        let width = 5;

        let area = length * width;
        let perimeter = 2 * (length + width);

        console.log("The area of the rectangle is " + area);
        console.log("The perimeter of the rectangle is " + perimeter);



        // TASK 5: SWAP VALUES

let a = 5;
let b = 10;

// Before swapping
console.log("Before swap: a = " + a + ", b = " + b);

// Use a temporary variable to swap values
let temp = a;
a = b;
b = temp;

// After swapping
console.log("After swap: a = " + a + ", b = " + b);

    </script>

</body>
</html>
